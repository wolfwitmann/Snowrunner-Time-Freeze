name: Build exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymem pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --console --name SnowRunnerTimeLock sr_timelock.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SnowRunnerTimeLock
          path: dist/SnowRunnerTimeLock.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SnowRunnerTimeLock.exe
